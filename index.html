<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garapan Penjahit Kimonik V32</title>

<style>
:root{
  color-scheme:light dark;
  --bg:#f6f3ee;
  --surface:#fff;
  --text:#24211e;
  --muted:#756e66;
  --line:#e5ded5;
  --accent:#6f4b32;
  --accent2:#9b7657;
  --good:#3e7654;
  --warn:#a06b28;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text)
}

button,input,select,textarea{
  font-family:inherit
}

button{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  font-weight:650;
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

button.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}

button.danger{
  background:#9b3d3d;
  color:#fff;
  border-color:#9b3d3d
}

button.good{
  background:var(--good);
  color:#fff;
  border-color:var(--good)
}

#app{
  min-height:100vh;
  background:var(--bg)
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:28px 20px 50px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:24px
}

.eyebrow{
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--accent2);
  font-weight:700
}

.title{
  font-size:30px;
  font-weight:800;
  margin:5px 0
}

.sub{
  color:var(--muted);
  font-size:14px
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.tab.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent)
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:17px
}

.label{
  font-size:12px;
  color:var(--muted)
}

.num{
  font-size:24px;
  font-weight:800;
  margin-top:6px
}

.money{
  font-size:19px
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
  margin-bottom:18px
}

.panelhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px
}

.panel h2{
  font-size:18px;
  margin:0
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px
}

.field label{
  font-size:12px;
  color:var(--muted);
  font-weight:650
}

.field input,
.field select,
.field textarea{
  font:inherit;
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface);
  color:var(--text);
  width:100%
}

.field textarea{
  min-height:42px
