<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semua Koleksi | Kimonik</title><meta name="description" content="Jelajahi koleksi busana tenun Kimonik."><link rel="icon" type="image/svg+xml" href="favicon.svg"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--ink:#24221f;--line:#e6e2dc}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1200px;padding:0 22px;margin:auto}header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:10}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:78px}.brand{font-size:27px;font-weight:900;letter-spacing:3px}.top nav{display:flex;gap:24px;font-size:13px}.intro{padding:68px 0 35px;text-align:center}.intro small{letter-spacing:3px;color:#806348;font-weight:700}.intro h1{font:normal clamp(35px,5vw,58px) Georgia,serif;margin:14px 0}.intro p{color:#666}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 14px}.item{display:block;min-width:0}.photo{aspect-ratio:3/4;background:#f5f3ef;display:flex;align-items:center;justify-content:center;color:#777;overflow:hidden;font-size:13px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:13px 0 20px}.name{font-size:14px;font-weight:650;line-height:1.45;min-height:41px}.price{font-size:15px;font-weight:700;margin-top:10px}.muted{color:#777;font-size:12px;margin-top:6px}.pager{display:flex;align-items:center;justify-content:center;gap:18px;margin:38px auto 70px}.pager button{background:#222;color:white;border:0;padding:13px 19px;cursor:pointer}.pager button:disabled{background:#ddd;color:#888;cursor:default}.status{text-align:center;color:#777;padding:35px 0}.footer{border-top:1px solid var(--line);padding:28px 0;color:#777;font-size:13px}@media(max-width:700px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.top{min-height:64px}.brand{font-size:21px}.top nav{gap:12px}.intro{padding:45px 0 24px}.wrap{padding:0 14px}}</style></head>
<body><header><div class="wrap top"><a class="brand" href="index.html">KIMONIK</a><nav><a href="index.html">Beranda</a><a href="cek-order.html">Cek Pesanan</a><a href="order.html">Pesan</a></nav></div></header><main class="wrap"><section class="intro"><small>KIMONIK INDONESIA</small><h1>Semua Koleksi</h1><p>Busana tenun untuk momen istimewa.</p></section><div id="status" class="status" role="status">Memuat koleksi...</div><div id="products" class="products"></div><div class="pager"><button id="prev" type="button" disabled>Sebelumnya</button><span id="page">Halaman 1</span><button id="next" type="button" disabled>Berikutnya</button></div></main><footer class="footer"><div class="wrap">© 2026 Kimonik · <a href="order.html">Mulai Pesan</a></div></footer>
<script>
const db=supabase.createClient("https://ilxahxzrtzpzhnlskfns.supabase.co","sb_publishable_eetxbGhYGFLhJdXhiU2W0A_qG63dTyU");
const limit=12;let page=0;let busy=false;const el=document.getElementById("products"),status=document.getElementById("status"),prev=document.getElementById("prev"),next=document.getElementById("next");
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n||0));
function price(p){const a=(Array.isArray(p.variasi)?p.variasi:[]).map(v=>Number(v.harga||0)).filter(v=>v>0);return money(a.length?Math.min(...a):p.harga_jual)}
async function load(){if(busy)return;busy=true;prev.disabled=true;next.disabled=true;status.hidden=false;status.textContent="Memuat koleksi...";el.innerHTML="";
try{const {data,error}=await db.rpc("get_katalog_kimonik_page",{p_limit:limit,p_offset:page*limit});if(error)throw error;const items=Array.isArray(data)?data:[];if(!items.length&&page>0){page--;busy=false;return load()}status.hidden=items.length>0;status.textContent=items.length?"":"Belum ada produk yang dapat ditampilkan.";el.innerHTML=items.map(p=>{const photo=p.foto_url?'<img loading="lazy" src="'+esc(p.foto_url)+'" alt="'+esc(p.nama_produk)+'">':"Foto belum tersedia";return '<a class="item" href="order.html"><div class="photo">'+photo+'</div><div class="info"><div class="name">'+esc(p.nama_produk)+'</div><div class="muted">'+esc(p.kategori||"Koleksi Kimonik")+'</div><div class="price">'+price(p)+'</div></div></a>'}).join("");prev.disabled=page===0;next.disabled=items.length<limit;document.getElementById("page").textContent="Halaman "+(page+1)}catch(e){console.error(e);status.hidden=false;status.textContent="Koleksi gagal dimuat. Silakan coba lagi.";prev.disabled=page===0}finally{busy=false}}
prev.addEventListener("click",()=>{if(page>0){page--;load();window.scrollTo({top:0,behavior:"smooth"})}});next.addEventListener("click",()=>{page++;load();window.scrollTo({top:0,behavior:"smooth"})});load();
</script></body></html>
