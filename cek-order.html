<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek Pesanan Kimonik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f6f3ee;
  --surface:#fff;
  --surface2:#f1eee8;
  --text:#292621;
  --muted:#777168;
  --line:#ded8cf;
  --primary:#292621;
  --success:#2f7d4a;
  --warning:#b7791f;
  --danger:#b33a3a;
  --blue:#4267a8;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--primary);
  color:#fff;
}

.header-inner{
  max-width:900px;
  margin:auto;
  padding:18px 16px;
}

.brand{
  font-size:21px;
  font-weight:800;
}

.sub{
  font-size:11px;
  opacity:.7;
  margin-top:3px;
}

.container{
  max-width:760px;
  margin:auto;
  padding:28px 14px 70px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
}

h1,h2,h3{margin-top:0}

.intro{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.field{
  margin-bottom:13px;
}

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

input{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  font:inherit;
  outline:none;
  background:#fff;
}

input:focus{
  border-color:#999;
}

.btn{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.meta{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.order-code{
  font-size:22px;
  font-weight:800;
}

.total{
  font-size:24px;
  font-weight:800;
  margin-top:8px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  background:var(--surface2);
}

.badge.success{
  background:#e4f2e8;
  color:var(--success);
}

.badge.warning{
  background:#fff1d7;
  color:#96610d;
}

.badge.blue{
  background:#e6edf9;
  color:var(--blue);
}

.badge.danger{
  background:#fae3e3;
  color:var(--danger);
}

.progress{
  margin-top:24px;
}

.progress-track{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.step{
  text-align:center;
}

.dot{
  width:28px;
  height:28px;
  margin:0 auto 6px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ded8cf;
  color:#777168;
  font-size:12px;
  font-weight:800;
}

.step.active .dot{
  background:var(--primary);
  color:#fff;
}

.step.done .dot{
  background:var(--success);
  color:#fff;
}

.step-label{
  font-size:10px;
  color:var(--muted);
  line-height:1.3;
}

.items{
  margin-top:14px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid var(--line);
}

.item:last-child{
  border-bottom:0;
}

.item-name{
  font-size:13px;
  font-weight:700;
}

.item-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.shipping{
  background:#eef4fb;
  border:1px solid #d5e2f3;
  border-radius:12px;
  padding:13px;
  margin-top:14px;
}

.error{
  background:#fae3e3;
  border:1px solid #edcaca;
  border-radius:12px;
  padding:13px;
  color:var(--danger);
  font-size:13px;
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  margin-top:24px;
}

@media(max-width:600px){
  .progress-track{
    grid-template-columns:1fr;
    text-align:left;
  }

  .step{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
  }

  .dot{
    margin:0;
    flex:0 0 auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">Kimonik</div>
    <div class="sub">Cek status pesanan</div>
  </div>
</header>

<main class="container">

  <div class="card">

    <h1>Cek Pesanan</h1>

    <p class="intro">
      Masukkan kode order dan nomor WhatsApp yang digunakan saat pemesanan.
    </p>

    <div class="field">
      <label>Kode Order</label>
      <input
        id="kodeOrder"
        placeholder="Contoh: KIM-20261007-000002">
    </div>

    <div class="field">
      <label>Nomor WhatsApp</label>
      <input
        id="whatsapp"
        placeholder="08xxxxxxxxxx"
        inputmode="tel">
    </div>

    <button
      id="cekBtn"
      class="btn"
      style="width:100%"
      onclick="cekOrder()">
      Cek Pesanan
    </button>

  </div>

  <div id="result"></div>

  <footer>
    Kimonik · Tenun untuk momen istimewa
  </footer>

</main>

<script>

const SUPABASE_URL =
"https://ilxahxzrtzpzhnlskfns.supabase.co";

const SUPABASE_KEY =
"sb_publishable_eetxbGhYGFLhJdXhiU2W0A_qG63dTyU";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function rupiah(v){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(Number(v || 0));

}


function dateID(v){

  if(!v)
    return "-";

  return new Date(v)
    .toLocaleString(
      "id-ID",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


function badge(status){

  let cls = "";

  if(status === "LUNAS" || status === "SELESAI")
    cls = "success";

  else if(status === "BARU" || status === "BELUM_BAYAR")
    cls = "warning";

  else if(status === "DIPROSES" || status === "DIKIRIM")
    cls = "blue";

  else if(status === "DIBATALKAN" || status === "GAGAL")
    cls = "danger";


  return `
    <span class="badge ${cls}">
      ${esc(status)}
    </span>
  `;

}


function progressIndex(status){

  const map = {
    "BARU":0,
    "MENUNGGU_PEMBAYARAN":0,
    "LUNAS":1,
    "DIPROSES":2,
    "DIKIRIM":3,
    "SELESAI":4
  };

  return map[status] ?? 0;

}


function progressHtml(status){

  const labels = [
    "Pesanan dibuat",
    "Lunas",
    "Diproses",
    "Dikirim",
    "Selesai"
  ];

  const idx =
    progressIndex(status);


  return `

    <div class="progress">

      <div class="progress-track">

        ${
          labels.map(
            (label,i)=>{

              let cls = "";

              if(i < idx)
                cls = "done";

              else if(i === idx)
                cls = "active";


              return `

                <div class="step ${cls}">

                  <div class="dot">
                    ${i+1}
                  </div>

                  <div class="step-label">
                    ${label}
                  </div>

                </div>

              `;

            }
          ).join("")
        }

      </div>

    </div>

  `;

}


async function cekOrder(){

  const kode =
    document
      .getElementById("kodeOrder")
      .value
      .trim();

  const wa =
    document
      .getElementById("whatsapp")
      .value
      .trim();

  const result =
    document.getElementById("result");

  const btn =
    document.getElementById("cekBtn");


  if(!kode || !wa){

    result.innerHTML =
      '<div class="error">Kode order dan WhatsApp wajib diisi.</div>';

    return;

  }


  btn.disabled = true;
  btn.textContent = "Memeriksa...";


  const {data,error} =
    await supabaseClient.rpc(
      "cek_order_kimonik",
      {
        p_kode_order:
          kode,

        p_whatsapp:
          wa
      }
    );


  btn.disabled = false;
  btn.textContent = "Cek Pesanan";


  if(error){

    console.error(error);

    result.innerHTML = `
      <div class="error">
        Gagal memeriksa pesanan:
        ${esc(error.message)}
      </div>
    `;

    return;

  }


  if(!data?.success){

    result.innerHTML = `
      <div class="error">
        ${esc(
          data?.message ||
          "Pesanan tidak ditemukan."
        )}
      </div>
    `;

    return;

  }


  const items =
    Array.isArray(data.items)
    ? data.items
    : [];


  result.innerHTML = `

    <div class="card">

      <div class="order-code">
        ${esc(data.kode_order)}
      </div>

      <div class="meta">
        Dibuat ${dateID(data.created_at)}
        <br>
        Atas nama:
        <strong>${esc(data.nama)}</strong>
      </div>

      <div class="badges">

        ${badge(data.status)}

        ${badge(data.status_pembayaran)}

      </div>

      ${
        data.status !== "DIBATALKAN"
        ? progressHtml(data.status)
        : `
          <div class="error" style="margin-top:16px">
            Pesanan ini dibatalkan.
          </div>
        `
      }

    </div>


    <div class="card">

      <h3>Detail Pesanan</h3>

      <div class="items">

        ${
          items.map(
            i => `

              <div class="item">

                <div>

                  <div class="item-name">
                    ${esc(i.nama_produk)}
                  </div>

                  <div class="item-meta">

                    ${
                      i.nama_variasi
                      ? esc(i.nama_variasi)
                      : ""
                    }

                  </div>

                </div>


                <div style="text-align:right">

                  <strong>
                    ${i.qty} ×
                    ${rupiah(i.harga_satuan)}
                  </strong>

                  <div class="item-meta">
                    ${rupiah(i.subtotal)}
                  </div>

                </div>

              </div>

            `
          ).join("")
        }

      </div>


      <div style="margin-top:14px">

        <div class="meta">
          Subtotal
        </div>

        <div>
          ${rupiah(data.subtotal)}
        </div>

      </div>


      ${
        Number(data.ongkir || 0) > 0

        ? `
          <div style="margin-top:8px">
            <div class="meta">Ongkir</div>
            <div>${rupiah(data.ongkir)}</div>
          </div>
        `

        : ""
      }


      ${
        Number(data.diskon || 0) > 0

        ? `
          <div style="margin-top:8px">
            <div class="meta">Diskon</div>
            <div>- ${rupiah(data.diskon)}</div>
          </div>
        `

        : ""
      }


      <div class="total">
        ${rupiah(data.total)}
      </div>

    </div>


    ${
      data.nomor_resi

      ? `

        <div class="card">

          <h3>Pengiriman</h3>

          <div class="shipping">

            <div class="meta">
              Kurir
            </div>

            <strong>
              ${esc(data.kurir || "J&T")}
            </strong>

            <div
              class="meta"
              style="margin-top:10px">
              Nomor Resi
            </div>

            <div
              style="
                font-size:18px;
                font-weight:800;
                margin-top:3px
              ">
              ${esc(data.nomor_resi)}
            </div>

          </div>

        </div>

      `

      : ""
    }

  `;

}

</script>

</body>
</html>
